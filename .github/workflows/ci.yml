name: Verify WealthOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            wealthos-source/package-lock.json
      - run: npm ci
      - run: npm ci --prefix wealthos-source --ignore-scripts
      - run: npm test
      - run: npm run build

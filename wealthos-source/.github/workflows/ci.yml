name: WealthOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wealthos_test
          POSTGRES_USER: wealthos_test
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wealthos_test -d wealthos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://wealthos_test:ci-only-disposable-password@localhost:5432/wealthos_test?schema=public
      JWT_SECRET: ci-only-disposable-jwt-secret-never-use-in-production-0123456789
      CORS_ORIGIN: http://localhost:4200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run build:all
      - run: npm test
